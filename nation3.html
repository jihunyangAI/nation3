<!doctype html>
<html lang="ko" class="booting">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nation3</title>

<style>

  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif; font-size:14px; }

  #date { font-size:16px; font-weight:bold; }
  #summary { color:var(--dim); flex:1; }
  main { display:flex; gap:12px; padding:12px; align-items:flex-start; flex-wrap:wrap; }

  #map { display:block; width:100%; height:auto; max-height:calc(100vh - 92px); cursor:grab; user-select:none; -webkit-user-select:none; }

  #mapctl { position:absolute; right:8px; top:8px; display:flex; flex-direction:column; gap:4px; align-items:stretch; text-align:center; }

  #zoomLv { font-size:11px; color:#2b2418; font-weight:bold; }

  .cname { font-size:13px; font-weight:bold; fill:#2b2418; paint-order:stroke; stroke:#e9dfc6; stroke-width:3px; }
  .region { font-family:"Batang","Nanum Myeongjo",serif; font-size:21px; font-weight:bold; fill:#6b4a1e; opacity:.32; letter-spacing:5px; }
  .geo { font-family:"Batang","Nanum Myeongjo",serif; font-size:10.5px; font-style:italic; paint-order:stroke; stroke:#e6dab9; stroke-width:2px; }
  .ctroop { font-size:11px; fill:#4a3b22; paint-order:stroke; stroke:#e9dfc6; stroke-width:3px; }
  aside { flex:2 1 360px; display:flex; flex-direction:column; gap:12px; min-width:0; }
  #cityPanel, #log { background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:12px; }
  #log { max-height:230px; overflow-y:auto; font-size:13px; line-height:1.6; }
  #log span { color:var(--dim); font-size:11px; margin-right:4px; }

  h2 { margin:0 0 8px; font-size:18px; } h2 small { font-size:13px; color:var(--dim); font-weight:normal; margin-left:6px; }
  h3 { margin:0 0 4px; font-size:15px; }
  .dot { display:inline-block; width:12px; height:12px; border-radius:50%; margin-right:6px; border:1px solid #000; }
  table { border-collapse:collapse; width:100%; }
  .stats td { padding:3px 6px; } .stats td:nth-child(odd) { color:var(--dim); width:44px; white-space:nowrap; }
  .stats a { color:var(--gold); cursor:pointer; margin-right:4px; text-decoration:underline; }
  .bar { display:inline-block; width:60px; height:7px; background:#14110e; border-radius:4px; vertical-align:middle; overflow:hidden; }
  .bar i { display:block; height:100%; background:var(--gold); }
  .offs { margin-top:10px; font-size:13px; }
  .offs th { color:var(--dim); font-weight:normal; border-bottom:1px solid var(--line); padding:3px; }
  .offs td { text-align:center; padding:3px; border-bottom:1px solid #352d23; }
  .offs td:first-child { text-align:left; font-weight:bold; }
  .offs .hi { color:var(--gold); font-weight:bold; }
  .offs .acted { opacity:.45; }
  .offs.pick tr:not(:first-child) { cursor:pointer; } .offs.pick tr:not(:first-child):hover { background:#3d3327; }
  button { background:#3d3327; color:var(--ink); border:1px solid #6a5a42; border-radius:4px; padding:7px 12px; font:inherit; cursor:pointer; }
  button:hover:not(:disabled) { background:#54452f; border-color:var(--gold); }
  button:disabled { opacity:.4; cursor:default; }
  button.atk { background:#6b201a; border-color:#a8473c; } button.atk:hover:not(:disabled) { background:#8a2a22; }
  button small { display:block; font-size:10px; color:var(--dim); }
  .cmds { display:grid; grid-template-columns:repeat(5,1fr); gap:6px; margin-top:10px; }
  .flash { margin-top:10px; padding:6px 10px; background:#3a3122; border-left:3px solid var(--gold); }
  .dim { color:var(--dim); }
  #modal { position:fixed; inset:0; background:rgba(0,0,0,.65); display:flex; align-items:center; justify-content:center; padding:16px; z-index:10; }
  #modal.hidden { display:none; }
  #modalBox { background:var(--panel); border:2px solid var(--gold); border-radius:8px; padding:18px; width:min(620px,100%); max-height:92vh; overflow-y:auto; }
  #modalBox label { display:block; margin:8px 0; }
  input[type=number], select { background:#14110e; color:var(--ink); border:1px solid #6a5a42; border-radius:4px; padding:5px 8px; font:inherit; }
  input[type=number] { width:110px; }
  .row { display:flex; gap:8px; margin-top:12px; }
  .wide { width:100%; margin:8px 0; padding:10px; font-size:15px; }
  .flist { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px; }
  .fbtn { text-align:left; line-height:1.5; } .fbtn small { display:inline; font-size:12px; }
  .checks { display:grid; grid-template-columns:1fr 1fr; gap:2px 12px; margin:8px 0; }
  .checks label { margin:2px 0 !important; } .checks small { color:var(--dim); }
  .armies { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .army { background:#1d1915; border:1px solid var(--line); border-radius:6px; padding:10px; line-height:1.6; }
  .army.me { border-color:var(--gold); }
  .army .big { font-size:22px; font-weight:bold; } .army .big small { font-size:12px; color:var(--dim); font-weight:normal; }
  .blog { background:#14110e; border-radius:6px; padding:8px 10px; margin:10px 0; height:150px; overflow-y:auto; font-size:13px; line-height:1.6; }
  #modalBox.big { width:min(860px,100%); }
  .field { display:block; width:100%; height:auto; max-height:52vh; border:2px solid var(--line); cursor:pointer; }
  .tg { font-size:17px; fill:#00000066; pointer-events:none; } .tu { font-size:13px; font-weight:bold; fill:#fff; pointer-events:none; } .tn { font-size:9.5px; fill:#fff; pointer-events:none; }
  .blog.small { height:82px; }
  .face { border:2px solid var(--gold); flex:none; }
  #modalBox input:not([type=checkbox]):not([type=number]) { background:#14110e; color:var(--ink); border:1px solid #6a5a42; padding:5px 8px; font:inherit; }
  .scene { display:block; width:100%; height:auto; border:2px solid var(--line); }
  .cicon { display:block; margin:0 auto 3px; }
  .mapback { display:none; }
  html { -webkit-text-size-adjust:100%; }
  button, .field { touch-action:manipulation; }
  html.titling, html.titling body { overflow:hidden; }
  #title { --c:min(42vh,27vw); --pan:calc((max(100vw,177.78vh) - 100vw) * .42); position:fixed; inset:0; z-index:30; overflow:hidden; background:#0b0705; color:#f3e3bd; cursor:pointer; user-select:none; -webkit-user-select:none; transition:opacity .75s ease; }
  #title.leaving { opacity:0; pointer-events:none; }
  #tMural { position:absolute; left:50%; top:50%; width:max(100vw,177.78vh); height:max(56.25vw,100vh); opacity:0; transform:translate(-50%,-50%) scale(1.03); transition:opacity 1.5s ease; }
  #title.on #tMural { opacity:1; animation:tDrift 46s ease-in-out infinite alternate; }
  @keyframes tDrift { from { transform:translate(calc(-50% - var(--pan)),-50%) scale(1.03); } to { transform:translate(calc(-50% + var(--pan)),-50%) scale(1.09); } }
  .tShade { position:absolute; inset:0; background:radial-gradient(ellipse 62% 48% at 50% 36%,rgba(12,6,3,.74),rgba(12,6,3,.34) 68%,rgba(12,6,3,.12)),linear-gradient(180deg,rgba(10,5,3,.5),rgba(10,5,3,.06) 42%,rgba(10,5,3,.16) 66%,rgba(10,5,3,.74)); }
  .tFire { position:absolute; inset:0; mix-blend-mode:soft-light; background:radial-gradient(ellipse 80% 54% at 50% 100%,rgba(255,116,38,.75),transparent 72%); animation:tFlicker 3.7s ease-in-out infinite; }
  @keyframes tFlicker { 0%,100% { opacity:.62; } 22% { opacity:.86; } 41% { opacity:.56; } 67% { opacity:.94; } 83% { opacity:.68; } }
  .tEmbers { position:absolute; inset:0; pointer-events:none; }
  .tEmbers i { position:absolute; bottom:-12px; width:4px; height:4px; border-radius:50%; background:#ffb65c; box-shadow:0 0 7px 2px rgba(255,120,40,.72); animation:tEmber 9s linear infinite; }
  @keyframes tEmber { 0% { transform:translate(0,0) scale(1); opacity:0; } 10% { opacity:.95; } 72% { opacity:.62; } 100% { transform:translate(var(--dx),-104vh) scale(.28); opacity:0; } }
  .tStage { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:clamp(4px,1.6vh,16px); padding:max(10px,env(safe-area-inset-top)) 16px max(26px,env(safe-area-inset-bottom)); }
  .tChars { position:relative; display:flex; margin:0; font-size:inherit; }
  .tGlyph { display:block; width:var(--c); height:var(--c); overflow:visible; }
  #title.written .tGlyph { filter:drop-shadow(0 0 14px rgba(255,180,76,.5)); }
  .tSeal { position:absolute; right:calc(var(--c) * -.11); bottom:calc(var(--c) * -.05); width:calc(var(--c) * .24); height:calc(var(--c) * .24); opacity:0; }
  #title.sealed .tSeal { animation:tStamp .42s cubic-bezier(.2,.8,.3,1) forwards; }
  @keyframes tStamp { from { opacity:0; transform:scale(2.7) rotate(-8deg); } 62% { opacity:1; transform:scale(.93) rotate(2deg); } to { opacity:1; transform:scale(1) rotate(2deg); } }
  #title.sealed .tChars { animation:tThud .34s ease-out .17s; }
  @keyframes tThud { 0%,100% { transform:none; } 30% { transform:translateY(4px); } 62% { transform:translateY(-2px); } }
  .tName,.tSub,.tBtns { opacity:0; transform:translateY(10px); transition:opacity .7s ease,transform .7s ease; }
  .tName { margin:0; color:#e9c675; font:700 clamp(13px,2.5vmin,21px) Georgia,"Times New Roman",serif; letter-spacing:.62em; padding-left:.62em; text-shadow:0 2px 5px #000; }
  .tSub { margin:0; font:clamp(14px,2.7vmin,23px) "Batang","Nanum Myeongjo","AppleMyungjo",serif; letter-spacing:.14em; text-align:center; text-shadow:0 2px 6px #000,0 0 14px #000; word-break:keep-all; }
  .tBtns { display:flex; gap:10px; align-items:center; flex-wrap:wrap; justify-content:center; pointer-events:none; }
  #title.ready .tName,#title.ready .tSub,#title.ready .tBtns { opacity:1; transform:none; }

  #tGo { min-height:48px; padding:11px 34px; color:#fff1cb; background:linear-gradient(#9d2b1e,#671810); border:1px solid #e3bd69; border-radius:3px; box-shadow:0 0 0 3px rgba(20,8,4,.75),0 0 0 4px #9f7c39,0 7px 22px rgba(0,0,0,.72); font:700 clamp(16px,2.9vmin,22px) "Batang","Nanum Myeongjo","AppleMyungjo",serif; letter-spacing:.2em; }

  #tSnd { min-height:44px; color:#e8d7b0; background:rgba(20,11,6,.72); border-color:#7a6236; }
  .tHint { position:absolute; left:0; right:0; bottom:max(7px,env(safe-area-inset-bottom)); margin:0; text-align:center; color:#d9c8a2; font-size:12px; opacity:.72; text-shadow:0 1px 3px #000; transition:opacity .4s; pointer-events:none; }

  #title.menu { z-index:9; cursor:default; }
  #title.menu::after { opacity:1; }
  #title.menu #tMural { animation-play-state:paused; }
  #title.menu .tFire { animation-play-state:paused; }
  #title.menu .tEmbers, #title.menu .tHint { display:none; }

  #modal.menu { background:transparent; }
  #modal.menu #modalBox { background:rgba(24,15,9,.58); -webkit-backdrop-filter:blur(5px); backdrop-filter:blur(5px); border:1px solid rgba(227,189,105,.78); border-radius:4px; box-shadow:0 0 0 1px rgba(20,8,4,.8),0 0 0 4px rgba(20,8,4,.34),0 18px 54px rgba(0,0,0,.62); animation:tPanel .55s ease both; }

  }
</style>
</head>

const V = { x: 0, y: 0, z: 1 };
const MAX_Z = 9;
const line = l => l.map((p, i) => (i ? 'L' : 'M') + P(p[0], p[1]).join(',')).join('');
const mapSvg = () => document.getElementById('map');
function pxPer() { const m = mapSvg().getScreenCTM(); return m && m.a > 0 ? m.a : 1; }
function toWorld(cx, cy) {
  const m = mapSvg().getScreenCTM();
  return m ? [(cx - m.e) / m.a, (cy - m.f) / m.d] : [V.x, V.y];
}
function clampView() {
  V.z = clamp(V.z, 1, MAX_Z);
  V.x = clamp(V.x, 0, MAP_W - MAP_W / V.z); V.y = clamp(V.y, 0, MAP_H - MAP_H / V.z);
}
function applyView() {

  s.style.touchAction = V.z > 1.01 ? 'none' : 'pan-y';
  if (G) drawOverlay();
}
function zoomAt(wx, wy, f) {
  const fx = (wx - V.x) / (MAP_W / V.z), fy = (wy - V.y) / (MAP_H / V.z);
  V.z = clamp(V.z * f, 1, MAX_Z);
  V.x = wx - fx * MAP_W / V.z; V.y = wy - fy * MAP_H / V.z;
  applyView();
}
function mapZoom(f) { zoomAt(V.x + MAP_W / V.z / 2, V.y + MAP_H / V.z / 2, f); }
function viewAt(lon, lat, z) { const [x, y] = P(lon, lat); V.z = z; V.x = x - MAP_W / z / 2; V.y = y - MAP_H / z / 2; applyView(); }
function focusMap() { V.x = 0; V.y = 0; V.z = 1; applyView(); }
function backToMap() { window.scrollTo({ top: 0, behavior: 'smooth' }); }
function selectCity(i) {
  sel = i; flash = '';
  const c = G.cities[i], w = MAP_W / V.z, h = MAP_H / V.z;
  if (c.x < V.x || c.x > V.x + w || c.y < V.y || c.y > V.y + h) { V.x = c.x - w / 2; V.y = c.y - h / 2; clampView(); }

function initMap() {
  const s = mapSvg(), pts = new Map();
  let moved = false, startX = 0, startY = 0, pinch = null;
  const pair = () => { const [a, b] = [...pts.values()]; return { d: Math.hypot(a.x - b.x, a.y - b.y) || 1, x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }; };
  s.addEventListener('pointerdown', e => {
    s.setPointerCapture(e.pointerId);
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size === 1) { moved = false; startX = e.clientX; startY = e.clientY; }
    if (pts.size === 2) { moved = true; pinch = pair(); }
  });
  s.addEventListener('pointermove', e => {
    const p = pts.get(e.pointerId);
    if (!p) return;
    const dx = e.clientX - p.x, dy = e.clientY - p.y;
    p.x = e.clientX; p.y = e.clientY;
    if (pts.size === 2 && pinch) {
      const n = pair(), k = pxPer(), [wx, wy] = toWorld(n.x, n.y);
      V.x -= (n.x - pinch.x) / k; V.y -= (n.y - pinch.y) / k;
      pinch = n.d && pinch.d ? (zoomAt(wx - (n.x - pinch.x) / k, wy - (n.y - pinch.y) / k, n.d / pinch.d), n) : n;
    } else if (pts.size === 1) {
      if (Math.hypot(e.clientX - startX, e.clientY - startY) > 7) moved = true;
      if (moved && V.z > 1.01) { const k = pxPer(); V.x -= dx / k; V.y -= dy / k; applyView(); }
    }
  });
  const end = e => {
    const had = pts.delete(e.pointerId);
    if (pts.size < 2) pinch = null;
    if (!had || e.type !== 'pointerup' || moved || pts.size || !G) return;
    const [x, y] = toWorld(e.clientX, e.clientY), k = pxPer();
    let best = null, bd = 34 / k;
    G.cities.forEach(c => { const d = Math.hypot(c.x - x, c.y - y); if (d < bd) { bd = d; best = c; } });
    if (best) selectCity(best.id);
  };
  s.addEventListener('pointerup', end); s.addEventListener('pointercancel', end);
  s.addEventListener('wheel', e => {
    e.preventDefault();
    const [x, y] = toWorld(e.clientX, e.clientY);
    zoomAt(x, y, e.deltaY < 0 ? 1.2 : 1 / 1.2);
  }, { passive: false });
  s.addEventListener('dblclick', e => { const [x, y] = toWorld(e.clientX, e.clientY); zoomAt(x, y, 1.8); });
  window.addEventListener('resize', () => { if (G) drawOverlay(); });
}

  ROADS.forEach(r => {
    const [a, b] = r.split('-').map(n => G.cities[CNAME.indexOf(n)]), hot = a.id === sel || b.id === sel;
    h += `<line class="ns" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${hot ? '#b3261e' : isNavalRoad(a, b) ? '#2f7fa8' : '#6e5e3e'}" stroke-width="${hot ? 1.6 : .8}" stroke-dasharray="${hot ? '' : '3 3'}" opacity="${hot ? .9 : .65}"/>`;
  });
  G.cities.forEach(c => {
    const col = c.owner ? F[c.owner].color : '#a59c88', m = R * u / 14;
    if (c.id === sel) h += `<circle class="ns" cx="${c.x}" cy="${c.y}" r="${(R + 6) * u}" fill="none" stroke="#b3261e" stroke-width="2.5"/>`;
    h += `<g class="city" transform="translate(${c.x},${c.y}) scale(${m.toFixed(4)})"><path class="ns" d="M-14,10v-16h6v-5h5v5h6v-5h5v5h6v16z" fill="${col}" stroke="#2b2418" stroke-width="1"/>${c.owner === G.player ? '<circle r="4" cy="2" fill="#fff"/>' : ''}</g>`;
    if (G.emp === c.id) h += text(c.x + (R + 5) * u, c.y - (R - 3) * u, '★', 13, 'geo', '#c9a227');
    boxes.push({ x: sx(c.x) - R, y: sy(c.y) - R, w: R * 2, h: R * 2 });
  });
  const rank = c => (c.id === sel ? 0 : c.owner === G.player ? 1 : adj.includes(c.id) ? 2 : 3);
  [...G.cities].sort((a, b) => rank(a) - rank(b)).forEach(c => {
    const px = 12, w = c.name.length * px + 6, X = sx(c.x), Y = sy(c.y) - R - px - 3;

function actDevelop(o, kind) {
  const c = G.cities[o.city];
  if (c.gold < 100) return fail('금이 부족합니다. (100 필요)');
  if (c[kind] >= 100) return fail(`${DEVLABEL[kind]}은(는) 이미 최고 수준입니다.`);
  const stat = kind === 'wall' ? (o.st[0] + o.st[3]) / 2 : kind === 'loyal' ? (o.st[3] + o.st[4]) / 2 : o.st[3];
  const inc = Math.max(1, Math.round(stat / 14 + rnd(0, 2)));
  c.gold -= 100;
  c[kind] = clamp(c[kind] + inc, 0, 100);
  o.acted = true;
  return ok(`${o.name}: ${c.name}의 ${DEVLABEL[kind]} +${inc} (현재 ${c[kind]})`);
}

function recruitMax(o, c) {
  return Math.max(0, Math.floor(Math.min(c.gold / 0.3, c.pop - 30000, o.st[4] * 60 + 1000) / 100) * 100);

  const c = G.cities[o.city];

  if (n < 100) return fail('징병할 수 없습니다. (금·인구 부족)');
  c.gold -= Math.round(n * 0.3);

  c.train = Math.round((c.train * c.troops + 20 * n) / (c.troops + n));
  c.troops += n;
  c.loyal = clamp(c.loyal - Math.ceil(n / 1000), 0, 100);
  o.acted = true;

  o.acted = true;
  return ok(`${o.name}: ${c.name}의 훈련도 +${inc} (현재 ${c.train})`);
}

  if (found) return ok(`${o.name}이(가) 보물 ${found.name}을(를) 찾아냈습니다!`);
  const pool = G.officers.filter(x => !x.faction && !x.dead && x.city === c.id);
  if (pool.length && Math.random() < (o.st[2] + o.st[4]) / 220) {
    const t = pool[ri(0, pool.length - 1)];
    const p = clamp((rulerCharm(o.faction) + o.st[4]) / 220, 0.2, 0.95);
    if (Math.random() < p) {
      t.faction = o.faction; t.acted = true;
      return ok(`${o.name}이(가) 재야의 인재 ${t.name}을(를) 등용했습니다!`);
    }
    return ok(`${o.name}이(가) ${t.name}을(를) 찾아냈으나 출사를 거절당했습니다.`);
  }
  if (Math.random() < 0.3) {
    const g = ri(50, 200);
    c.gold += g;
    return ok(`${o.name}: 탐색 중 금 ${g}을(를) 얻었습니다.`);
  }
  return ok(`${o.name}: 아무것도 찾지 못했습니다.`);
}

function actMove(from, to, ids, troops, gold, food) {
  if (from.owner !== to.owner || !ADJ[from.id].includes(to.id)) return fail('이동할 수 없는 곳입니다.');
  const offs = ids.map(i => G.officers[i]).filter(o => o && o.city === from.id && !o.acted);
  if (!offs.length) return fail('수송을 맡을 무장을 선택하세요.');
  troops = clamp(troops | 0, 0, from.troops); gold = clamp(gold | 0, 0, from.gold); food = clamp(food | 0, 0, from.food);
  if (troops > 0) to.train = Math.round((to.train * to.troops + from.train * troops) / (to.troops + troops));
  from.troops -= troops; to.troops += troops;
  from.gold -= gold; to.gold += gold;
  from.food -= food; to.food += food;
  offs.forEach(o => { o.city = to.id; o.acted = true; });
  return ok(`${offs.map(o => o.name).join('·')}: ${from.name} → ${to.name} 이동 (병력 ${troops.toLocaleString()})`);
}

function actAlliance(o, target) {
  const c = G.cities[o.city];
  if (c.gold < 500) return fail('금이 부족합니다. (500 필요)');
  if (isAllied(o.faction, target)) return fail('이미 동맹 중입니다.');
  c.gold -= 500; o.acted = true;
  const mine = factionCities(o.faction).length, theirs = factionCities(target).length;
  const p = clamp(0.25 + (o.st[2] + o.st[4]) / 400 + (getRel(o.faction, target) - 50) / 120 - (mine > theirs * 2 ? 0.2 : 0), 0.05, 0.9);
  if (Math.random() < p) {
    G.allies.push({ a: o.faction, b: target, until: now() + 24, kind: 'ally' });
    addRel(o.faction, target, 10);
    return ok(`${o.name}의 설득으로 ${F[target].name}과(와) 2년간 동맹을 맺었습니다.`);
  }
  return ok(`${F[target].name}이(가) 동맹 제안을 거절했습니다.`);
}

// ===================== 전투 =====================
const TACTIC = { charge: '돌격', volley: '사격', ploy: '계략', guard: '수비' };
const MAX_ROUND = 12;

function makeArmy(offs, troops, train, faction) {
  const mx = i => (offs.length ? Math.max(...offs.map(o => o.st[i])) : 40);
  const champ = offs.length ? offs.reduce((a, b) => (b.st[1] > a.st[1] ? b : a)) : null;
  return { faction, offs, troops, start: troops, morale: 100, train, cmd: mx(0), war: mx(1), int: mx(2), champ };
}

function createBattle(from, to, offs, troops) {
  from.troops -= troops;
  const defOffs = cityOfficers(to.id).sort((a, b) => b.st[0] - a.st[0]).slice(0, 5);
  syncMen(from); syncMen(to);
  const b = {
    from: from.id, to: to.id, wall: to.wall, round: 0, log: [], dueled: false, winner: null,
    att: makeArmy(offs, troops, from.train, from.owner),
    def: makeArmy(defOffs, to.troops, to.train, to.owner),
  };
  applyNaval(b);
  return b;
}

function strike(me, en, my, their) {
  const base = me.troops * (0.6 + me.train / 250) * (0.5 + me.morale / 200) * rnd(0.85, 1.15);
  let dmg = 0, hit = 0, self = 0, note = '';
  if (my === 'charge') {
    const m = their === 'ploy' ? 1.5 : their === 'guard' ? 0.5 : their === 'volley' ? 1.1 : 1;
    dmg = base * 0.13 * (me.war / 80) * m;
  } else if (my === 'volley') {
    dmg = base * 0.09 * (me.cmd / 80) * (their === 'guard' ? 0.7 : 1);
  } else if (my === 'guard') {
    dmg = base * 0.05 * (me.cmd / 80) * (their === 'charge' ? 1.8 : 1);
    self = 4;
  } else {
    const p = clamp(50 + (me.int - en.int) / 1.2 + (their === 'guard' ? 25 : 0) - (their === 'charge' ? 30 : 0), 5, 95);
    if (Math.random() * 100 < p) { dmg = en.troops * 0.1 + base * 0.04; hit = 15; note = '성공'; }
    else { self = -8; note = '실패'; }
  }
  return { dmg, hit, self, note };
}

function checkEnd(b) {
  if (b.winner) return;
  const A = b.att, D = b.def;
  if (A.troops <= 0 || A.morale <= 0) { b.winner = 'def'; b.log.push('▶ 공격군이 무너졌습니다. 수비군의 승리!'); }
  else if (D.troops <= 0 || D.morale <= 0) { b.winner = 'att'; b.log.push('▶ 수비군이 무너졌습니다. 성이 함락되었습니다!'); }
  else if (b.round >= MAX_ROUND) { b.winner = 'def'; b.log.push('▶ 공성이 길어져 공격군이 철수합니다.'); }
}

function battleRound(b, ta, td) {
  if (b.winner) return;
  b.round++;
  const A = b.att, D = b.def;
  const ra = strike(A, D, ta, td), rd = strike(D, A, td, ta);
  const toD = Math.min(D.troops, Math.round(ra.dmg / (1 + b.wall / 200) * (td === 'guard' && ta !== 'ploy' ? 0.5 : 1)));
  const toA = Math.min(A.troops, Math.round(rd.dmg * (ta === 'guard' && td !== 'ploy' ? 0.5 : 1)));
  const la = toA / A.troops, ld = toD / D.troops;
  A.troops -= toA; D.troops -= toD;
  A.morale = clamp(A.morale + ra.self - rd.hit - (la > ld ? 6 : 0), 0, 120);
  D.morale = clamp(D.morale + rd.self - ra.hit - (ld > la ? 6 : 0), 0, 120);
  const tag = (t, r) => TACTIC[t] + (r.note ? `(${r.note})` : '');
  b.log.push(`${b.round}합 │ 공격 ${tag(ta, ra)} vs 수비 ${tag(td, rd)} │ 공격군 -${toA.toLocaleString()}, 수비군 -${toD.toLocaleString()}`);
  checkEnd(b);
}

function battleDuel(b, side) {
  if (b.dueled || b.winner) return;
  b.dueled = true;
  const me = b[side], en = b[side === 'att' ? 'def' : 'att'];
  if (!me.champ || !en.champ) { b.log.push('일기토에 나설 장수가 없습니다.'); return; }
  const a = me.champ, e = en.champ;
  if (e.st[1] < a.st[1] - 8) {
    en.morale = clamp(en.morale - 6, 0, 120);
    b.log.push(`${a.name}이(가) 일기토를 청했으나 ${e.name}은(는) 응하지 않았습니다. (적 사기 -6)`);
  } else if (Math.random() < clamp(0.5 + (a.st[1] - e.st[1]) / 40, 0.05, 0.95)) {
    en.morale = clamp(en.morale - 22, 0, 120); me.morale = clamp(me.morale + 8, 0, 120);
    b.log.push(`일기토! ${a.name}이(가) ${e.name}을(를) 물리쳤습니다! (적 사기 -22)`);
  } else {
    me.morale = clamp(me.morale - 22, 0, 120); en.morale = clamp(en.morale + 8, 0, 120);
    b.log.push(`일기토! ${a.name}이(가) ${e.name}에게 패했습니다... (아군 사기 -22)`);
  }
  checkEnd(b);
}

function aiTactic(me, en, isDef) {
  const w = {
    charge: 2 + (me.war - 70) / 10,
    volley: 2,
    ploy: 1.5 + (me.int - en.int) / 10,
    guard: (isDef ? 2.5 : 0.8) + (me.morale < 40 ? 1 : 0),
  };
  let sum = 0;
  for (const k in w) { w[k] = Math.max(0.2, w[k]); sum += w[k]; }
  let r = Math.random() * sum;
  for (const k in w) { r -= w[k]; if (r <= 0) return k; }
  return 'volley';
}

function destroyFaction(f, by) {
  G.officers.forEach(o => {
    if (o.faction !== f) return;
    o.faction = null;
    if (o.ruler) { o.dead = true; o.city = -1; }
  });
  G.allies = G.allies.filter(x => x.a !== f && x.b !== f);
  log(`${F[f].name}이(가) ${F[by].name}에게 멸망했습니다.`, 'big');
  if (f === G.player) G.over = 'lose';
}

async function finishBattle(b) {
  const from = G.cities[b.from], to = G.cities[b.to], A = b.att, D = b.def;
  if (b.winner !== 'att') {
    from.troops += Math.round(A.troops * 0.85);
    to.troops = D.troops;
    log(`${F[A.faction].name}의 ${to.name} 공격이 실패했습니다.`, 'war');
    return;
  }
  const old = to.owner;
  const defOffs = old ? G.officers.filter(o => o.city === to.id && o.faction === old && !o.dead) : [];
  to.owner = A.faction;
  to.troops = A.troops + Math.round(Math.max(0, D.troops) * 0.3);
  to.train = A.train;
  if (old) {
    to.wall = Math.max(0, to.wall - 10); to.loyal = Math.max(0, to.loyal - 10);
    to.farm = Math.max(0, to.farm - 4); to.trade = Math.max(0, to.trade - 4);
  }
  A.offs.forEach(o => { o.city = to.id; });
  log(`${F[A.faction].name}이(가) ${to.name}을(를) ${old ? F[old].name + '에게서 빼앗았습니다' : '점령했습니다'}.`, 'war');
  to.deleg = false; to.gov = null;
  if (old) {
    addRel(A.faction, old, -10);
    const refuge = factionCities(old), gone = !refuge.length, caught = [];
    if (gone) destroyFaction(old, A.faction);
    defOffs.forEach(o => {
      if (o.dead) return;
      if (gone || (!o.ruler && Math.random() < 0.4)) { caught.push(o); return; }
      const near = refuge.filter(c => ADJ[to.id].includes(c.id)), l = near.length ? near : refuge;
      o.city = l[ri(0, l.length - 1)].id;
    });
    await handleCaptives(caught, A.faction, gone ? null : old, to, refuge);
  }
  if (G.player && G.cities.every(c => c.owner === G.player)) G.over = 'win';
}

async function resolveBattle(b) {
  if (b.def.troops <= 0) b.winner = 'att';
  else if (UI && G.player && (b.att.faction === G.player || b.def.faction === G.player)) await UI.battle(b);
  else while (!b.winner) battleRound(b, aiTactic(b.att, b.def, false), aiTactic(b.def, b.att, true));
  await finishBattle(b);
}

async function startAttack(from, to, ids, troops, help) {
  if (!ADJ[from.id].includes(to.id) || !isHostile(from.owner, to)) return fail('공격할 수 없는 곳입니다.');
  const offs = ids.map(i => G.officers[i]).filter(o => o && o.city === from.id && !o.acted).slice(0, 5);
  troops = clamp(Math.floor((troops | 0) / 100) * 100, 0, from.troops);
  if (!offs.length) return fail('출진할 무장을 선택하세요.');
  troops = Math.min(troops, Math.floor(commandCap(offs) / 100) * 100);
  if (troops < 100) return fail('병력이 부족합니다.');
  offs.forEach(o => { o.acted = true; });
  log(`${F[from.owner].name}의 ${offs[0].name} 등이 병력 ${troops.toLocaleString()}으로 ${to.name}(${fname(to.owner)})에 출진!`, 'war');
  const b = createBattle(from, to, offs, troops);
  if (help) {
    const c = ADJ[to.id].map(i => G.cities[i]).find(x => x.owner && x.owner !== from.owner && x.owner !== to.owner && x.troops > 4000 && G.allies.some(a => a.kind === 'ally' && ((a.a === from.owner && a.b === x.owner) || (a.b === from.owner && a.a === x.owner))));
    if (c) {
      const n = Math.floor(c.troops * 0.25 / 100) * 100;
      c.troops -= n; b.att.troops += n; b.att.start += n; addRel(from.owner, c.owner, -3);
      log(`동맹 ${F[c.owner].name}이(가) ${c.name}에서 원군 ${n.toLocaleString()}을(를) 보냈습니다.`, 'sys');
    }
  }
  await resolveBattle(b);
  return ok('전투가 끝났습니다.');
}

// ===================== AI =====================
function frontDist(f) {
  const d = G.cities.map(() => 99), q = [];
  G.cities.forEach(c => {
    if (c.owner === f && ADJ[c.id].some(i => isHostile(f, G.cities[i]))) { d[c.id] = 0; q.push(c.id); }
  });
  while (q.length) {
    const x = q.shift();
    for (const n of ADJ[x]) if (G.cities[n].owner === f && d[n] > d[x] + 1) { d[n] = d[x] + 1; q.push(n); }
  }
  return d;
}

let aiAttacks = 0; // 세력당 한 달에 벌이는 대규모 공세 수 제한
async function aiTurn(f) {
  aiAttacks = 0;
  aiStrategy(f);
  for (const c of factionCities(f)) {
    if (G.over) return;
    await aiCity(f, c, true);
  }
}

async function aiCity(f, c, war) {
  {
    if (c.owner !== f) return;
    let offs = cityOfficers(c.id).filter(o => !o.acted).sort((a, b) => b.st[0] - a.st[0]);
    if (!offs.length) return;
    const targets = ADJ[c.id].map(i => G.cities[i]).filter(t => isHostile(f, t) && aiMayAttack(f, t));

    // 출진 판단
    if (war && targets.length && c.troops >= 2500) {
      const q = 0.6 + c.train / 250;
      const power = t => t.troops * (1 + t.wall / 200) * (0.6 + t.train / 250) / q;
      targets.sort((a, b) => power(a) - power(b));
      const t = targets[0];
      const others = Math.max(0, ...targets.filter(x => x !== t && x.owner).map(x => x.troops));
      if (t.troops === 0) {
        const send = Math.min(3000, Math.floor(c.troops * 0.4 / 100) * 100);
        if (send >= 500) await startAttack(c, t, [offs[offs.length - 1].id], send);
      } else {
        const send = Math.floor(c.troops * 0.8 / 100) * 100;
        if (aiAttacks < 1 + (Math.random() < 0.25 ? 1 : 0) && send > power(t) * 1.1 && c.troops - send >= others * 0.2 && Math.random() < 0.6) {
          aiAttacks++;
          await startAttack(c, t, offs.slice(0, 5).map(o => o.id), send);
        }
      }
      if (G.over) return;
    }
    if (c.owner !== f) return;
    offs = cityOfficers(c.id).filter(o => !o.acted);

    // 후방 → 전방 수송
    if (!targets.length && c.troops > 2000 && offs.length) {
      const d = frontDist(f);
      const dest = ADJ[c.id].map(i => G.cities[i]).filter(x => x.owner === f && d[x.id] < d[c.id]).sort((a, b) => d[a.id] - d[b.id])[0];
      if (dest) {
        const movers = offs.filter(o => !o.ruler).slice(0, Math.max(1, Math.floor(offs.length / 2)));
        if (movers.length) actMove(c, dest, movers.map(o => o.id), Math.floor(c.troops * 0.7), Math.floor(c.gold * 0.3), Math.floor(c.food * 0.3));
        offs = cityOfficers(c.id).filter(o => !o.acted);
      }
    }

    for (const o of offs) {
      const n = Math.min(recruitMax(o, c), 3000);
      if (c.loyal < 40 && c.gold >= 100) actDevelop(o, 'loyal');
      else if (n >= 500 && c.gold >= 700 && c.troops < 14000 + Math.min(factionCities(f).length, 8) * 1000 && c.loyal > 45 && (targets.length || Math.random() < 0.25)) actRecruit(o, n);
      else if (c.train < 75 && c.troops > 0) actTrain(o);
      else if (Math.random() < 0.12) {
        const r = actSearch(o);
        if (r.msg.includes('등용')) log(`${F[f].name}: ${r.msg}`);
      } else if (c.gold >= 100) {
        const kinds = ['farm', 'trade', 'wall', 'loyal', 'flood'].filter(k => c[k] < 100).sort((a, b) => c[a] - c[b]);
        if (kinds.length) actDevelop(o, kinds[0]);
      }
    }
  }
}

// ===================== 월말 처리 =====================
function monthEnd() {
  for (const c of G.cities) {
    if (!c.owner) continue;
    c.gold += Math.round((c.trade * 10 + c.pop / 1000) * TAX[c.tax].gold);
    c.food -= Math.round(c.troops * 0.08);
    if (G.month === 9) {
      const h = Math.round((c.farm * 450 + c.pop / 15) * TAX[c.tax].food);
      c.food += h;
      if (c.owner === G.player) log(`${c.name}: 가을걷이로 군량 ${h.toLocaleString()} 수확`);
    }
    if (c.food < 0) {
      c.food = 0; c.troops = Math.round(c.troops * 0.9); c.loyal = Math.max(0, c.loyal - 3);
      if (c.owner === G.player) log(`${c.name}: 군량이 떨어져 병사들이 흩어지고 있습니다!`, 'war');
    }
    c.pop = clamp(Math.round(c.pop * (1 + (c.loyal - 45) / 4000)), 10000, 600000);
    if (c.loyal < 30 && Math.random() < 0.1) {
      c.pop = Math.round(c.pop * 0.95); c.gold = Math.round(c.gold * 0.8);
      if (c.owner === G.player) log(`${c.name}에서 민란이 일어났습니다!`, 'war');
    }
  }
  monthExtras();
  sweepItems();
  G.officers.forEach(o => { o.acted = false; });
  G.month++;
  if (G.month > 12) { G.month = 1; G.year++; }
  G.allies = G.allies.filter(x => {
    if (x.until > now()) return true;
    if (x.a === G.player || x.b === G.player) log(`${F[x.a === G.player ? x.b : x.a].name}과(와)의 동맹 기한이 끝났습니다.`, 'sys');
    return false;
  });
}

// ===================== 화면 =====================
let sel = 0, busy = false, flash = '';
const $ = id => document.getElementById(id);
const num = n => Math.round(n).toLocaleString();
const short = n => (n >= 10000 ? (n / 10000).toFixed(1) + '만' : String(n));
const SAVE_KEY = 'nation3_save_v4';

function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(G)); } catch (e) { /* 저장 불가 환경 */ } }
function load() {
  try {
    const s = localStorage.getItem(SAVE_KEY);
    if (!s) return false;
    G = JSON.parse(s);
    applyScenarioNames(scenarioOf(G.scenario));
    G.officers.forEach(o => { if (o.ruler && o.faction) F[o.faction].ruler = o.name; });
    return true;
  } catch (e) { return false; }
}

function openModal(html) { $('modalBox').innerHTML = html; $('modal').classList.remove('hidden'); }
function closeModal() { $('modal').classList.add('hidden'); }

function startGame(id) {
  newGame(id, pendingScenario, pendingCustom);
  pendingCustom = null;
  sel = G.cities.find(c => c.owner === id).id;
  if (typeof hideMenuBg === 'function') hideMenuBg();
  closeModal(); save(); render(); focusMap();
}
function continueGame() {
  if (!load()) return;
  const mine = G.cities.find(c => c.owner === G.player);
  sel = mine ? mine.id : 0;
  if (typeof hideMenuBg === 'function') hideMenuBg();
  closeModal(); render(); focusMap();
  if (G.over) showOver();
}
function showOver() {
  openModal(G.over === 'win'
    ? `<h2>천하통일!</h2><p>${G.year}년 ${G.month}월, ${titleName(G.player)} ${F[G.player].ruler}의 깃발이 온 천하에 나부낍니다.</p><button class="wide" onclick="showStart()">새 게임</button>`
    : `<h2>멸망</h2><p>${F[G.player].name}의 꿈은 여기서 끝났습니다...</p><button class="wide" onclick="showStart()">새 게임</button>`);
}

function render() {
  const f = F[G.player], mine = factionCities(G.player);
  $('date').textContent = `${G.year}년 ${G.month}월`;
  $('summary').innerHTML = `<b style="color:${f.color}">${f.name}</b> · ${titleName(G.player)} · 도시 ${mine.length}/${G.cities.length} · 병력 ${num(mine.reduce((s, c) => s + c.troops, 0))} · 무장 ${G.officers.filter(o => o.faction === G.player).length}`;
  $('endBtn').disabled = busy || !!G.over;
  $('endBtn').textContent = busy ? '다른 세력 행동 중…' : '턴 종료 ▶';
  renderMap(); renderCity(); renderLog();
}

function renderCity() {
  const c = G.cities[sel], mine = c.owner === G.player;
  if (c.owner) syncMen(c);
  const offs = cityOfficers(c.id).sort((a, b) => b.ruler - a.ruler || b.st[0] - a.st[0]);
  const ally = c.owner && c.owner !== G.player && isAllied(G.player, c.owner);
  const see = !c.owner || canSee(G.player, c), gov = c.owner ? getGov(c) : null, adv = c.owner ? getAdvisor(c.owner) : null;
  const bar = v => `<span class="bar"><i style="width:${v}%"></i></span> ${v}`;
  let h = `<h2><span class="dot" style="background:${c.owner ? F[c.owner].color : '#a59c88'}"></span>${c.name} <small>${provinceOf(c.name)} · ${fname(c.owner)}${ally ? ' · 동맹' : ''}</small><button class="mapback" onclick="backToMap()">지도</button></h2>
    <table class="stats"><tr><td>인구</td><td>${num(c.pop)}</td><td>병력</td><td>${num(c.troops)}</td></tr>
    <tr><td>금</td><td>${see ? num(c.gold) : '???'}</td><td>군량</td><td>${see ? num(c.food) : '???'}</td></tr>
    <tr><td>군마</td><td>${see ? num(c.horse) : '???'}</td><td>강노</td><td>${see ? num(c.bow) : '???'}</td></tr>
    <tr><td>전선</td><td>${see ? num(c.ships) : '???'}${PORTS.has(c.name) ? ' ⚓' : ''}</td><td>황제</td><td>${G.emp === c.id ? '★ 이곳에 계심' : empCity().name}</td></tr>
    <tr><td>농업</td><td>${bar(c.farm)}</td><td>상업</td><td>${bar(c.trade)}</td></tr>
    <tr><td>성벽</td><td>${bar(c.wall)}</td><td>민심</td><td>${bar(c.loyal)}</td></tr>
    <tr><td>훈련</td><td>${see ? bar(c.train) : '???'}</td><td>치수</td><td>${bar(c.flood)}</td></tr>
    <tr><td>세율</td><td>${see ? TAX[c.tax].n : '???'}${c.deleg ? ' · 위임' : ''}</td><td>인접</td><td>${ADJ[c.id].map(i => `<a onclick="selectCity(${i})">${G.cities[i].name}</a>`).join(' ')}</td></tr></table>`;
  if (mine && !G.over) {
    const dis = busy ? 'disabled' : '';
    const B = (k, t, x) => `<button ${dis} ${x ? 'class="atk"' : ''} onclick="cmd('${k}')">${cmdIcon(k)}${t}</button>`;
    h += `<div class="cmds">${B('farm', '개간')}${B('trade', '상업')}${B('wall', '축성')}${B('loyal', '순찰')}${B('flood', '치수')}
      ${B('recruit', '징병')}${B('train', '훈련')}${B('attack', '출진', 1)}${B('move', '이동')}${B('search', '탐색')}
      ${B('scheme', '계략')}${B('diplo', '외교')}${B('trade2', '상인')}${B('reward', '포상')}${B('appoint', '임명')}
      ${B('tax', '세율')}${B('deleg', c.deleg ? '위임 해제' : '위임')}
      ${B('ships', '조선')}${B('men', '배속')}${B('treasure', '보물')}${B('title', '작위')}${B('edict', '칙명')}${B('bond', '결의')}</div>`;
  }
  if (flash) h += `<div class="flash">${flash}</div>`;
  if (offs.length) {
    h += `<table class="offs pick"><tr><th>무장</th>${ST.map(s => `<th>${s}</th>`).join('')}<th>충성</th><th>병력</th><th></th></tr>
      ${offs.map(o => `<tr class="${o.acted ? 'acted' : ''}" onclick="showOfficer(${o.id})"><td>${o.ruler ? '★' : ''}${o.name}${adv === o ? ' <small>군</small>' : ''}${gov === o ? ' <small>태</small>' : ''}</td>${o.st.map(v => `<td class="${v >= 90 ? 'hi' : ''}">${v}</td>`).join('')}<td>${see && !o.ruler ? o.loyal : o.ruler ? '—' : '?'}</td><td>${see ? short(o.men || 0) : '?'}</td><td>${mine ? (o.acted ? '완료' : '대기') : ''}</td></tr>`).join('')}</table>`;
  } else h += `<p class="dim">${c.owner ? '주둔 무장이 없습니다.' : '주인 없는 땅입니다. 인접한 아군 도시에서 출진하면 점령할 수 있습니다.'}</p>`;
  $('cityPanel').innerHTML = h;
}

function renderLog() {
  $('log').innerHTML = G.log.slice(-60).reverse().map(l => `<div class="${l.cls}"><span>${l.t}</span> ${l.msg}</div>`).join('');
}

function done(r) {
  flash = r.msg;
  if (r.ok) log(r.msg);
  closeModal(); render();
}

let pickCb = null;
function pickOfficer(title, offs, hint, cb) {
  pickCb = cb;
  openModal(`<h2>${title}</h2><p class="dim">${hint}</p>
    <table class="offs pick"><tr><th>무장</th>${ST.map(s => `<th>${s}</th>`).join('')}</tr>
    ${offs.map(o => `<tr onclick="pickCb(G.officers[${o.id}])"><td>${o.name}</td>${o.st.map(v => `<td>${v}</td>`).join('')}</tr>`).join('')}</table>
    <button onclick="closeModal()">취소</button>`);
}
const offChecks = offs => `<div class="checks">${offs.map(o => `<label><input type="checkbox" name="off" value="${o.id}"> ${o.name} <small>통${o.st[0]} 무${o.st[1]} 지${o.st[2]}</small></label>`).join('')}</div>`;
const checked = () => [...document.querySelectorAll('input[name=off]:checked')].map(e => +e.value);

function cmd(kind) {
  if (busy || G.over) return;
  const c = G.cities[sel];
  if (FREE_CMD[kind]) return FREE_CMD[kind](c);
  const offs = cityOfficers(c.id).filter(o => !o.acted);
  if (kind === 'trade2' && offs.length) return EXTRA_CMD.trade(c, offs);
  if (EXTRA_CMD[kind] && kind !== 'trade' && offs.length) return EXTRA_CMD[kind](c, offs);
  if (!offs.length) { flash = '행동할 수 있는 무장이 없습니다.'; return render(); }
  if (DEV[kind]) return pickOfficer(`${DEV[kind]} — 금 100`, offs, kind === 'wall' ? '통솔과 내정이 높을수록 효과적입니다.' : kind === 'loyal' ? '내정과 인덕이 높을수록 효과적입니다.' : '내정이 높을수록 효과적입니다.', o => done(actDevelop(o, kind)));
  if (kind === 'train') return pickOfficer('훈련', offs, '통솔과 무력이 높을수록 효과적입니다.', o => done(actTrain(o)));
  if (kind === 'search') return pickOfficer('탐색', offs, '지략과 인덕이 높을수록 재야 인재를 찾기 쉽습니다.', o => done(actSearch(o)));
  if (kind === 'recruit') {
    return pickOfficer('징병 — 병사 1명당 금 0.3', offs, '인덕이 높을수록 한 번에 많이 모을 수 있습니다. 민심이 조금 떨어집니다.', o => {
      const mx = recruitMax(o, c);
      if (mx < 100) return done(fail('징병할 수 없습니다. (금·인구 부족)'));
      openModal(`<h2>징병 — ${o.name}</h2><p>최대 ${num(mx)}명</p>
        <input id="rn" type="number" min="100" max="${mx}" step="100" value="${mx}">
        <div class="row"><button onclick="done(actRecruit(G.officers[${o.id}], +$('rn').value))">징병</button><button onclick="closeModal()">취소</button></div>`);
    });
  }
  if (kind === 'move') {
    const dests = ADJ[c.id].map(i => G.cities[i]).filter(x => x.owner === G.player);
    if (!dests.length) { flash = '인접한 아군 도시가 없습니다.'; return render(); }
    return openModal(`<h2>이동 — ${c.name}에서</h2>
      <label>목적지 <select id="mv_to">${dests.map(d => `<option value="${d.id}">${d.name}</option>`).join('')}</select></label>
      ${offChecks(offs)}
      <label>병력 <input id="mv_t" type="number" min="0" max="${c.troops}" step="100" value="0"> / ${num(c.troops)}</label>
      <label>금 <input id="mv_g" type="number" min="0" max="${c.gold}" step="100" value="0"> / ${num(c.gold)}</label>
      <label>군량 <input id="mv_f" type="number" min="0" max="${c.food}" step="1000" value="0"> / ${num(c.food)}</label>
      <div class="row"><button onclick="doMove()">이동</button><button onclick="closeModal()">취소</button></div>`);
  }
  if (kind === 'attack') {
    const ts = ADJ[c.id].map(i => G.cities[i]).filter(x => isHostile(G.player, x));
    if (!ts.length) { flash = '공격할 수 있는 인접 도시가 없습니다.'; return render(); }
    const def = Math.floor(c.troops * 0.7 / 100) * 100;
    return openModal(`<h2>출진 — ${c.name}에서</h2>
      <label>목표 <select id="at_to">${ts.map(d => `<option value="${d.id}">${isNavalRoad(c, d) ? '⚓수전 ' : ''}${d.name} (${fname(d.owner)}, 병력 ${num(d.troops)}, 성벽 ${d.wall})</option>`).join('')}</select></label>
      <p class="dim">무장은 최대 5명. 출진 병력은 무장들의 지휘 한도(통솔 ×120) 합계까지입니다.</p>
      ${offChecks(offs)}
      <label>병력 <input id="at_t" type="number" min="100" max="${c.troops}" step="100" value="${def}"> / ${num(c.troops)}</label>
      <label><input type="checkbox" id="at_help"> 동맹군에게 원군 요청 (목표에 인접한 동맹 도시)</label>
      <div class="row"><button class="atk" onclick="doAttack()">출진!</button><button onclick="closeModal()">취소</button></div>`);
  }
}

function doMove() {
  done(actMove(G.cities[sel], G.cities[+$('mv_to').value], checked(), +$('mv_t').value, +$('mv_g').value, +$('mv_f').value));
}
async function doAttack() {
  const ids = checked(), to = G.cities[+$('at_to').value], troops = +$('at_t').value, help = $('at_help').checked;
  if (ids.length > 5) { alertLine('무장은 5명까지 출진할 수 있습니다.'); return; }
  closeModal();
  busy = true;
  const r = await startAttack(G.cities[sel], to, ids, troops, help);
  busy = false;
  flash = r.ok ? (to.owner === G.player ? `${to.name}을(를) 손에 넣었습니다!` : `${to.name} 공략에 실패했습니다.`) : r.msg;
  save(); render();
  if (G.over) showOver();
}
function alertLine(msg) {
  const box = $('modalBox');
  let e = box.querySelector('.flash');
  if (!e) { e = document.createElement('div'); e.className = 'flash'; box.appendChild(e); }
  e.textContent = msg;
}

function uiBattle(b) {
  return new Promise(resolve => {
    const side = b.att.faction === G.player ? 'att' : 'def';
    const other = side === 'att' ? 'def' : 'att';
    const to = G.cities[b.to];
    const army = (a, label, isMe) => `<div class="army ${isMe ? 'me' : ''}">
      <h3 style="color:${a.faction ? F[a.faction].color : '#aaa'}">${label} · ${fname(a.faction)}</h3>
      <div>${a.offs.map(o => o.name).join(' · ') || '수비대'}</div>
      <div class="big">${num(a.troops)} <small>/ ${num(a.start)}</small></div>
      <div>사기 <span class="bar"><i style="width:${Math.min(100, a.morale)}%"></i></span> ${Math.round(a.morale)}</div>
      <small>통솔 ${a.cmd} · 무력 ${a.war} · 지략 ${a.int} · 훈련 ${a.train}</small></div>`;
    const draw = () => {
      openModal(`<h2>⚔ ${to.name} 공방전 <small>${b.round}/${MAX_ROUND}합 · 성벽 ${b.wall}</small></h2>
        <div class="armies">${army(b.att, '공격', side === 'att')}${army(b.def, '수비', side === 'def')}</div>
        <div class="blog" id="blog">${b.log.map(l => `<div>${l}</div>`).join('') || '<div class="dim">전술을 고르세요. 돌격은 계략을 꺾고, 수비는 돌격을 막아내며, 계략은 수비를 무너뜨립니다. 사격은 무난합니다.</div>'}</div>
        ${b.winner
          ? `<button class="wide" onclick="_bend()">${b.winner === side ? '승리!' : '패배...'} — 닫기</button>`
          : `<div class="cmds">
              <button onclick="_bt('charge')">돌격<small>무력</small></button><button onclick="_bt('volley')">사격<small>통솔</small></button>
              <button onclick="_bt('ploy')">계략<small>지략</small></button><button onclick="_bt('guard')">수비<small>통솔</small></button>
              <button ${b.dueled ? 'disabled' : ''} onclick="_bduel()">일기토<small>1회</small></button>
              ${side === 'att' ? '<button onclick="_bret()">퇴각</button>' : ''}</div>`}`);
      const e = $('blog'); e.scrollTop = e.scrollHeight;
    };
    window._bt = t => {
      if (b.winner) return;
      const ai = aiTactic(b[other], b[side], other === 'def');
      if (side === 'att') battleRound(b, t, ai); else battleRound(b, ai, t);
      draw();
    };
    window._bduel = () => { battleDuel(b, side); draw(); };
    window._bret = () => { b.winner = 'def'; b.log.push('▶ 공격군이 퇴각했습니다.'); draw(); };
    window._bend = () => { closeModal(); resolve(); };
    draw();
  });
}

async function endTurn() {
  if (busy || G.over) return;
  busy = true; flash = ''; render();
  for (const c of factionCities(G.player)) if (c.deleg) await aiCity(G.player, c, false);
  for (const f of FACTIONS) {
    if (f.id === G.player || !alive(f.id)) continue;
    await aiTurn(f.id);
    if (G.over) break;
  }
  if (!G.over) monthEnd();
  await playEvents();
  busy = false;
  if (!G.cities[sel]) sel = 0;
  save(); render();
  if (G.over) showOver();
}

if (typeof document !== 'undefined') {
  UI = { battle: b => uiBattleEntry(b), captive: (o, f) => uiCaptive(o, f) };
  window.addEventListener('DOMContentLoaded', () => { initMap(); showTitle(); });
  document.addEventListener('keydown', e => {
    if ((e.key === 'e' || e.key === 'E') && G && $('modal').classList.contains('hidden')) endTurn();
  });
}
if (typeof module !== 'undefined') {
  module.exports = { newGame, aiTurn, monthEnd, alive, factionCities, FACTIONS, state: () => G };
}

</script>

function applyScenarioNames(sc) {
  FACTIONS.forEach(f => {
    const ruler = (sc.rulers && sc.rulers[f.id]) || BASE_FACTION[f.id].ruler;
    f.ruler = ruler;
    f.name = ruler === BASE_FACTION[f.id].ruler ? BASE_FACTION[f.id].name : ruler + '군';
  });
}
const scenarioOf = id => SCENARIOS.find(s => s.id === id) || SCENARIOS[0];
function scenarioFactions(sc) {
  return FACTIONS.filter(f => (sc.own ? !!sc.own[f.id] : CITY_DEF.some(d => d[3] === f.id)));
}

function setupScenario(sc) {
  applyScenarioNames(sc);
  G.scenario = sc.id;
  G.year = sc.year;
  G.cities.forEach(c => {
    Object.assign(c, { tax: 1, flood: ri(30, 60), horse: c.owner ? 9000 : 0, bow: c.owner ? 9000 : 0, gov: null, deleg: false });
  });
  if (sc.early) {
    EARLY_OFFICERS.forEach(d => G.officers.push({
      id: G.officers.length, name: d[0], faction: null, city: CNAME.indexOf(d[2]), st: d.slice(3, 8), acted: false, ruler: false, dead: false,
    }));
  }
  G.officers.forEach(o => {
    o.loyal = ri(62, 92);
    o.die = sc.year + ri(14, 48);
  });
  if (sc.own) {
    const def = {};
    CITY_DEF.forEach(d => { def[d[0]] = d[8]; });
    G.cities.forEach(c => { c.owner = null; c.troops = 0; c.train = 0; c.gold = 500; c.food = 8000; c.horse = 0; c.bow = 0; c.loyal = 50; });
    Object.entries(sc.own).forEach(([f, names]) => names.forEach(n => {
      Object.assign(G.cities[CNAME.indexOf(n)], {
        owner: f, troops: Math.max(def[n], 9000) + (names.length <= 5 ? 7000 : 0) + ((sc.bonus && sc.bonus[f]) || 0), train: 55, gold: 2000, food: 30000, horse: 9000, bow: 9000, loyal: 62,
      });
    }));
    G.officers.forEach(o => { o.faction = null; o.ruler = false; });
    (sc.gone || []).forEach(n => {
      const o = G.officers.find(x => x.name === n);
      if (o) { o.dead = true; o.city = -1; }
    });
    Object.entries(sc.off).forEach(([f, names]) => {
      const cs = sc.own[f].map(n => CNAME.indexOf(n));
      names.forEach((n, i) => {
        const o = G.officers.find(x => x.name === n);
        if (!o) return;
        o.dead = false; o.faction = f; o.city = cs[i % cs.length]; o.ruler = n === F[f].ruler;
      });
    });
  }
  if (!sc.own) G.officers.forEach(o => { o.ruler = !!o.faction && F[o.faction].ruler === o.name; });
  G.officers.forEach(o => {
    if (o.ruler) o.loyal = 100;
    const y = DEBUT[o.name];
    if (sc.early && y > sc.year && !o.faction && !o.dead) {
      o.debut = y; o.debutCity = o.city; o.dead = true; o.city = -1; o.die = y + ri(25, 50);
    }
  });
  (sc.pacts || []).forEach(([a, b]) => {
    G.allies.push({ a, b, until: now() + sc.pactMonths, kind: 'ally' });
    addRel(a, b, 20);
  });
  setupFeatures(sc);
}

function addCustomOfficer(cu) {
  const city = G.cities.find(c => c.owner === G.player);
  G.officers.push({
    id: G.officers.length, name: cu.name, faction: G.player, city: city.id, st: cu.st, acted: false,
    ruler: false, dead: false, loyal: 100, die: G.year + 60, custom: true,
  });
}

// ===================== 관계·직책 =====================
const relKey = (a, b) => (a < b ? a + '|' + b : b + '|' + a);
const getRel = (a, b) => { const v = G.rel[relKey(a, b)]; return v === undefined ? 50 : v; };
const addRel = (a, b, d) => { G.rel[relKey(a, b)] = clamp(getRel(a, b) + d, 0, 100); };
const validOff = (id, f) => { const o = G.officers[id]; return o && !o.dead && o.faction === f ? o : null; };
const getAdvisor = f => (G.advisor[f] === undefined ? null : validOff(G.advisor[f], f));
function getGov(c) {
  const o = c.gov === null ? null : validOff(c.gov, c.owner);
  return o && o.city === c.id ? o : null;
}
function dist(a, b) {
  if (a === b) return 0;
  const d = { [a]: 0 }, q = [a];
  while (q.length) {
    const x = q.shift();
    for (const n of ADJ[x]) if (d[n] === undefined) { d[n] = d[x] + 1; if (n === b) return d[n]; q.push(n); }
  }
  return 99;
}
const canSee = (f, c) => c.owner === f || (c.owner && isAllied(f, c.owner)) || (G.spy[f + ':' + c.id] || 0) > now();

// 군사의 예측: 지략이 낮을수록 빗나간다
function advise(f, p) {
  const a = getAdvisor(f);
  if (!a) return '군사가 없어 가늠할 수 없습니다.';
  const err = (100 - a.st[2]) / 100 * 0.9 * rnd(-1, 1);
  const q = p + err;
  const word = q >= 0.75 ? '틀림없이 성공합니다' : q >= 0.5 ? '해볼 만합니다' : q >= 0.3 ? '쉽지 않습니다' : '그만두시는 편이 낫습니다';
  return `군사 ${a.name}: "${word}."`;
}

// ===================== 인사 =====================
function actReward(c, o) {
  if (c.gold < 200) return fail('금이 부족합니다. (200 필요)');
  if (o.ruler) return fail('군주에게는 포상할 수 없습니다.');
  if (o.loyal >= 100) return fail(`${o.name}의 충성은 이미 최고입니다.`);
  c.gold -= 200;
  const inc = ri(6, 12);
  o.loyal = clamp(o.loyal + inc, 0, 100);
  return ok(`${o.name}에게 금 200을 내렸습니다. 충성 +${inc} (현재 ${o.loyal})`);
}
function tryRecruit(o, f) {
  const p = clamp(rulerCharm(f) / 170 + (100 - o.loyal) / 220 - (o.ruler ? 0.3 : 0) + kinAdj(o, f), 0.05, 0.92);
  if (Math.random() >= p) return false;
  o.faction = f; o.ruler = false; o.loyal = ri(50, 70); o.acted = true;
  return true;
}
function succeed(f) {
  const c = G.officers.filter(o => o.faction === f && !o.dead).sort((a, b) => (b.st[4] + b.st[0]) - (a.st[4] + a.st[0]))[0];
  if (!c) return;
  c.ruler = true; c.loyal = 100; F[f].ruler = c.name;
  log(`${c.name}이(가) ${F[f].name}의 뒤를 이었습니다.`, 'big');
}
function killOfficer(o, why) {
  const f = o.faction, wasRuler = o.ruler;
  o.dead = true; o.ruler = false; o.faction = null; o.city = -1;
  if (f) log(`${F[f].name}의 ${o.name}이(가) ${why}.`, wasRuler ? 'big' : '');
  if (f && wasRuler) succeed(f);
}

async function handleCaptives(list, winner, loser, city, refuge) {
  for (const o of list) {
    if (o.dead) continue;
    let act;
    if (winner === G.player && UI) act = await UI.captive(o, winner);
    else act = o.loyal < 70 || rulerCharm(winner) > 80 ? 'recruit' : 'free';
    if (act === 'kill') {
      killOfficer(o, '처형되었습니다');
      if (loser && alive(loser)) addRel(winner, loser, -15);
      continue;
    }
    if (act === 'recruit' && tryRecruit(o, winner)) {
      o.city = city.id;
      log(`사로잡힌 ${o.name}이(가) ${F[winner].name}에 투항했습니다.`);
      continue;
    }
    if (act === 'recruit') log(`${o.name}이(가) 투항을 거부했습니다.`);
    if (loser && o.faction === loser && refuge.length) {
      o.city = refuge[ri(0, refuge.length - 1)].id;
      addRel(winner, loser, 3);
    } else { o.faction = null; o.ruler = false; }
  }
}

const SCHEME = {
  rumor: { n: '유언비어', cost: 200, d: '민심과 인구를 떨어뜨립니다.' },
  fire: { n: '방화', cost: 300, d: '금·군량을 태우고 성벽을 허뭅니다.' },
  sow: { n: '이간', cost: 200, d: '적장의 충성을 떨어뜨립니다.', off: true },
  lure: { n: '회유', cost: 500, d: '적장을 아군으로 끌어들입니다.', off: true },
  spy: { n: '첩자', cost: 100, d: '12개월간 그 도시의 내부를 살핍니다.' },
};
function schemeChance(o, kind, c, t) {
  const guard = Math.max(30, ...cityOfficers(c.id).map(x => x.st[2]));
  let p = 0.5 + (o.st[2] - guard) / 90;
  if (kind === 'spy') p += 0.3;
  if (kind === 'sow' && t) p += (70 - t.loyal) / 200;
  if (kind === 'lure' && t) p = 0.15 + (o.st[4] + rulerCharm(o.faction) - 120) / 250 + (65 - t.loyal) / 80 + kinAdj(t, o.faction);
  return clamp(p, 0.05, 0.95);
}
function actScheme(o, kind, c, t) {
  const home = G.cities[o.city], s = SCHEME[kind];
  if (!c.owner || !isHostile(o.faction, c)) return fail('대상이 될 수 없는 도시입니다.');
  if (dist(o.city, c.id) > 2) return fail('너무 멀리 있는 도시입니다. (2칸 이내)');
  if (home.gold < s.cost) return fail(`금이 부족합니다. (${s.cost} 필요)`);
  if (s.off && (!t || t.dead || t.faction !== c.owner || t.city !== c.id)) return fail('대상 무장이 없습니다.');
  if (kind === 'lure' && t.ruler) return fail('군주는 회유할 수 없습니다.');
  home.gold -= s.cost; o.acted = true;
  if (Math.random() >= schemeChance(o, kind, c, t)) {
    addRel(o.faction, c.owner, -4);
    return ok(`${o.name}의 ${s.n}이(가) ${c.name}에서 발각되어 실패했습니다.`);
  }
  addRel(o.faction, c.owner, -2);
  if (kind === 'rumor') {
    const d = ri(6, 14); c.loyal = Math.max(0, c.loyal - d); c.pop = Math.max(10000, Math.round(c.pop * 0.97));
    return ok(`${o.name}: ${c.name}에 소문이 퍼져 민심 -${d}`);
  }
  if (kind === 'fire') {
    const g = Math.round(c.gold * 0.25), fd = Math.round(c.food * 0.25);
    c.gold -= g; c.food -= fd; c.wall = Math.max(0, c.wall - 5);
    return ok(`${o.name}: ${c.name}에 불을 놓아 금 ${num(g)}, 군량 ${num(fd)} 소실`);
  }
  if (kind === 'sow') {
    const d = ri(10, 22); t.loyal = Math.max(0, t.loyal - d);
    return ok(`${o.name}: ${t.name}과(와) 주군 사이를 벌려 놓았습니다. (충성 -${d})`);
  }
  if (kind === 'lure') {
    t.faction = o.faction; t.city = o.city; t.loyal = ri(50, 70); t.acted = true;
    return ok(`${o.name}의 설득으로 ${t.name}이(가) 귀순했습니다!`);
  }
  G.spy[o.faction + ':' + c.id] = now() + 12;
  return ok(`${o.name}: ${c.name}에 첩자를 심었습니다.`);
}

const power = f => factionCities(f).reduce((s, c) => s + c.troops, 0) + factionCities(f).length * 3000;
function actGift(o, t) {
  const c = G.cities[o.city];
  if (c.gold < 500) return fail('금이 부족합니다. (500 필요)');
  c.gold -= 500; o.acted = true;
  const d = Math.round(6 + o.st[4] / 12);
  addRel(o.faction, t, d);
  return ok(`${o.name}이(가) ${F[t].name}에 예물을 보냈습니다. (우호 +${d}, 현재 ${getRel(o.faction, t)})`);
}
function actTruce(o, t) {
  const c = G.cities[o.city];
  if (c.gold < 200) return fail('금이 부족합니다. (200 필요)');
  if (isAllied(o.faction, t)) return fail('이미 협정 중입니다.');
  c.gold -= 200; o.acted = true;
  if (Math.random() < clamp(0.2 + getRel(o.faction, t) / 120 + o.st[2] / 500, 0.1, 0.9)) {
    G.allies.push({ a: o.faction, b: t, until: now() + 6, kind: 'truce' });
    return ok(`${F[t].name}과(와) 6개월 정전했습니다.`);
  }
  return ok(`${F[t].name}이(가) 정전을 거절했습니다.`);
}
function actBreak(f, t) {
  const n = G.allies.length;
  G.allies = G.allies.filter(x => !((x.a === f && x.b === t) || (x.a === t && x.b === f)));
  if (n === G.allies.length) return fail('맺은 협정이 없습니다.');
  addRel(f, t, -25);
  return ok(`${F[t].name}과(와)의 협정을 파기했습니다. (우호 -25)`);
}
function surrenderChance(f, t) { return clamp((power(f) / Math.max(1, power(t)) - 3) * 0.1 + getRel(f, t) / 400, 0, 0.7); }
function actSurrender(o, t) {
  const c = G.cities[o.city], f = o.faction;
  if (c.gold < 300) return fail('금이 부족합니다. (300 필요)');
  if (power(f) < power(t) * 3) return fail('세력 차이가 3배 이상이어야 합니다.');
  c.gold -= 300; o.acted = true;
  if (Math.random() >= surrenderChance(f, t)) { addRel(f, t, -8); return ok(`${F[t].name}이(가) 항복 권고를 물리쳤습니다.`); }
  factionCities(t).forEach(x => { x.owner = f; x.deleg = false; });
  G.officers.forEach(x => { if (x.faction === t && !x.dead) { x.faction = f; x.ruler = false; x.loyal = ri(50, 70); } });
  G.allies = G.allies.filter(x => x.a !== t && x.b !== t);
  log(`${F[t].name}이(가) ${F[f].name}에 항복했습니다!`, 'big');
  if (G.player && G.cities.every(x => x.owner === G.player)) G.over = 'win';
  return ok(`${F[t].name}이(가) 항복했습니다!`);
}

// ===================== 상인 =====================
const foodRate = () => 10 / G.price;
function actTrade(o, kind, n) {
  const c = G.cities[o.city];
  n = Math.floor(n);
  if (!(n > 0)) return fail('수량을 입력하세요.');
  if (kind === 'sell') {
    if (c.food < n) return fail('군량이 부족합니다.');
    const g = Math.floor(n / foodRate() * 0.8);
    c.food -= n; c.gold += g; o.acted = true;
    return ok(`군량 ${num(n)}을(를) 팔아 금 ${num(g)}을(를) 얻었습니다.`);
  }
  if (c.gold < n) return fail('금이 부족합니다.');
  c.gold -= n; o.acted = true;
  if (kind === 'food') { const q = Math.floor(n * foodRate()); c.food += q; return ok(`금 ${num(n)}으로 군량 ${num(q)} 구입`); }
  const q = n * 2;
  c[kind] += q;
  return ok(`금 ${num(n)}으로 ${kind === 'horse' ? '군마' : '강노'} ${num(q)} 구입`);
}

// ===================== AI 전략 =====================
function aiStrategy(f) {
  const offs = G.officers.filter(o => o.faction === f && !o.dead);
  if (!offs.length) return;
  featureAI(f);
  if (!getAdvisor(f)) G.advisor[f] = offs.reduce((a, b) => (b.st[2] > a.st[2] ? b : a)).id;
  factionCities(f).forEach(c => {
    c.tax = c.loyal < 40 ? 0 : c.loyal > 70 ? 2 : 1;
    const here = cityOfficers(c.id);
    if (!getGov(c) && here.length) c.gov = here.reduce((a, b) => (b.st[3] > a.st[3] ? b : a)).id;
    here.filter(o => !o.ruler && o.loyal < 55 && c.gold >= 500).slice(0, 1).forEach(o => actReward(c, o));
    if (c.troops > 5000) {
      if (c.horse < 6000 && c.gold > 1500) { c.gold -= 300; c.horse += 600; }
      if (c.bow < 6000 && c.gold > 1500) { c.gold -= 300; c.bow += 600; }
    }
    if (c.food < c.troops * 0.6 && c.gold > 800) { c.gold -= 400; c.food += Math.floor(400 * foodRate()); }
  });
  const free = offs.filter(o => !o.acted && !o.ruler);
  if (!free.length) return;
  const o = free.reduce((a, b) => (b.st[2] > a.st[2] ? b : a));
  const home = G.cities[o.city];
  const foes = G.cities.filter(c => c.owner && isHostile(f, c) && dist(o.city, c.id) <= 2);
  if (foes.length && o.st[2] >= 70 && home.gold >= 800 && Math.random() < 0.15) {
    const c = foes[ri(0, foes.length - 1)];
    const r = actScheme(o, Math.random() < 0.5 ? 'rumor' : 'fire', c);
    if (c.owner === G.player) log(`${F[f].name}: ${r.msg}`, 'war');
  } else if (home.gold >= 1200 && Math.random() < 0.06) {
    const others = FACTIONS.filter(x => x.id !== f && x.id !== G.player && alive(x.id) && !isAllied(f, x.id));
    if (others.length) {
      const t = others.sort((a, b) => getRel(f, b.id) - getRel(f, a.id))[0].id;
      const r = getRel(f, t) >= 55 ? actAlliance(o, t) : actGift(o, t);
      if (r.msg.includes('동맹을 맺')) log(`${F[f].name}: ${r.msg}`, 'sys');
    }
  }
}

// ===================== 월별 사건 =====================
const TAX = [{ n: '낮음', gold: 0.7, food: 0.85, loyal: 1 }, { n: '보통', gold: 1, food: 1, loyal: 0 }, { n: '높음', gold: 1.4, food: 1.2, loyal: -2 }];

function disaster(c) {
  const mine = c.owner === G.player, m = G.month, say = (t, cls) => { if (mine) log(`${c.name}: ${t}`, cls || 'war'); };
  const roll = Math.random();
  if (m >= 6 && m <= 8 && roll < 0.4) {
    const k = (100 - c.flood) / 100;
    if (Math.random() < k) {
      c.pop = Math.max(10000, Math.round(c.pop * (1 - 0.08 * k))); c.farm = Math.max(0, c.farm - Math.round(8 * k)); c.food = Math.round(c.food * (1 - 0.3 * k));
      say('홍수가 났습니다!');
    } else say('큰비가 왔으나 제방이 버텼습니다.', 'sys');
  } else if (m >= 7 && m <= 9 && roll < 0.65) {
    c.food = Math.round(c.food * 0.7); c.farm = Math.max(0, c.farm - 3); say('메뚜기 떼가 들판을 휩쓸었습니다!');
  } else if ((m <= 3 || m === 12) && roll < 0.4) {
    c.pop = Math.max(10000, Math.round(c.pop * 0.94)); c.troops = Math.round(c.troops * 0.93); say('역병이 돕니다!');
  } else if (c.loyal < 45 && roll < 0.8) {
    c.gold = Math.round(c.gold * 0.85); c.troops = Math.round(c.troops * 0.97); c.loyal = Math.max(0, c.loyal - 2); say('도적 떼가 창궐합니다!');
  } else if (m === 8 && roll > 0.8) {
    c.food += c.farm * 150; say('풍년의 조짐이 보입니다.', 'sys');
  }
}

// 황건 봉기 시나리오: 한 조정은 황건군만 토벌하다가 189년에 무너져 군웅으로 갈라진다
const HAN_HEIRS = { 낙양: 'dong', 장안: 'dong', 진양: 'dong', 진류: 'cao', 성도: 'zhang', 강주: 'zhang', 영안: 'zhang', 한중: 'zhang', 양양: 'biao', 강릉: 'biao', 장사: 'biao', 강하: 'biao', 건업: 'sun', 오: 'sun', 시상: 'sun', 완: 'shu', 여남: 'shu', 수춘: 'shu', 업: 'yuan', 평원: 'yuan', 복양: 'yuan', 남피: 'gong', 북해: 'tao' };

const aiMayAttack = (f, t) => !(t.owner && t.owner === G.player && now() < G.graceUntil) && (f !== 'han' || !hanIsPassive() || !t.owner || t.owner === 'huang');
function hanCollapse() {
  G.collapsed = true;
  const people = G.officers.filter(o => o.faction === 'han' && !o.dead);
  const can = f => alive(f) || people.some(o => o.name === F[f].ruler);
  factionCities('han').forEach(c => {

  });

    if (cs.length) { o.faction = h; o.city = cs[0].id; o.ruler = o.name === F[h].ruler; o.loyal = o.ruler ? 100 : ri(60, 85); } else o.faction = null;
  });

function monthExtras() {
  featureMonth();
  if (hanIsPassive() && G.year >= 189) { if (alive('han')) hanCollapse(); else G.collapsed = true; }
  G.officers.forEach(o => {
    if (o.debut && o.debut <= G.year) { o.dead = false; o.city = o.debutCity; delete o.debut; delete o.debutCity; }
  });
  G.price = clamp(G.price + rnd(-0.12, 0.12) - (G.month === 9 ? 0.15 : 0), 0.6, 1.6);
  for (const c of G.cities) {
    if (!c.owner) continue;
    c.loyal = clamp(c.loyal + TAX[c.tax].loyal, 0, 100);
    const g = getGov(c);
    if (g && Math.random() < g.st[3] / 300) {
      const k = ['farm', 'trade', 'loyal', 'flood'][ri(0, 3)];
      c[k] = clamp(c[k] + 1, 0, 100);
    }
  }
  if (Math.random() < 0.45) {
    const owned = G.cities.filter(c => c.owner);
    if (owned.length) disaster(owned[ri(0, owned.length - 1)]);
  }
  for (const o of G.officers) {
    if (o.dead) continue;
    if (G.year >= o.die && Math.random() < 0.08) { if (o.faction) killOfficer(o, '세상을 떠났습니다'); else { o.dead = true; o.city = -1; } continue; }
    if (!o.faction || o.ruler) continue;
    if (Math.random() < 0.15) o.loyal = clamp(o.loyal + (rulerCharm(o.faction) >= 75 ? 1 : -1), 0, 100);
    if (o.loyal < 35 && Math.random() < 0.07) {
      const f = o.faction, foes = ADJ[o.city].map(i => G.cities[i]).filter(c => c.owner && c.owner !== f);
      if (foes.length && Math.random() < 0.5) {
        const c = foes[ri(0, foes.length - 1)];
        o.faction = c.owner; o.city = c.id; o.loyal = ri(50, 70);
        log(`${F[f].name}의 ${o.name}이(가) ${F[c.owner].name}(으)로 넘어갔습니다!`, 'war');
      } else { o.faction = null; log(`${F[f].name}의 ${o.name}이(가) 관직을 버리고 떠났습니다.`, 'war'); }
    }
  }
  // 인재의 자진 출사, 무장이 없는 세력 구제
  FACTIONS.forEach(f => {
    if (!alive(f.id)) return;
    const none = !G.officers.some(o => o.faction === f.id && !o.dead);
    if (!none && Math.random() > 0.04) return;
    const cs = factionCities(f.id).map(c => c.id);
    const pool = G.officers.filter(o => !o.faction && !o.dead && (none || cs.includes(o.city)));
    if (!pool.length) return;
    const o = pool[ri(0, pool.length - 1)];
    o.faction = f.id; o.loyal = ri(60, 80);
    if (!cs.includes(o.city)) o.city = cs[0];
    if (none) { o.ruler = true; o.loyal = 100; F[f.id].ruler = o.name; }
    log(`${o.name}이(가) ${F[f.id].name}을(를) 찾아와 출사했습니다.`, f.id === G.player ? 'big' : '');
  });
}

// ===================== 화면: 초상·효과음 =====================
function portrait(o, size) {
  let h = 7;
  for (const ch of o.name) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  const pick = a => { h = (h * 16807 + 11) % 2147483647; return a[h % a.length]; };
  const skin = pick(['#e8c39e', '#dfb48a', '#d2a273', '#eccdaa']), hair = pick(['#231a14', '#3a2a1c', '#4a3626', '#2c2c34']);
  const hat = o.st[1] >= o.st[2] ? pick(['#8a2d22', '#3f5f8c', '#7a6a2a', '#555d66']) : pick(['#2e3f55', '#4b3a63', '#27564a', '#f0e8d4']);
  const px = [];
  const put = (x, y, w, h2, c) => px.push(`<rect x="${x}" y="${y}" width="${w}" height="${h2}" fill="${c}"/>`);
  put(0, 0, 12, 12, '#3a3226'); put(1, 9, 10, 3, hat); put(3, 2, 6, 7, skin); put(2, 3, 1, 4, hair); put(9, 3, 1, 4, hair);
  put(2, 0, 8, 3, hat); put(5, 0, 2, 1, '#d9b25a');
  put(4, 5, 1, 1, '#1a1410'); put(7, 5, 1, 1, '#1a1410'); put(4, 4, 1, 1, hair); put(7, 4, 1, 1, hair); put(5, 7, 2, 1, '#a0614a');
  if (o.st[0] + o.st[1] > 150) { put(4, 8, 4, 1, hair); put(5, 9, 2, 2, hair); }
  return `<svg class="face" width="${size}" height="${size}" viewBox="0 0 12 12" shape-rendering="crispEdges">${px.join('')}</svg>`;
}

const CUSTOM_POINTS = 360;
function showCreate() {
  openModal(`<h2>신무장 만들기</h2><p class="dim">능력치 합계 ${CUSTOM_POINTS} 이하, 각 항목 1~95</p>
    <label>이름 <input id="cu_n" maxlength="6" value="${pendingCustom ? pendingCustom.name : ''}"></label>
    ${ST.map((s, i) => `<label>${s} <input id="cu_${i}" type="number" min="1" max="95" value="${pendingCustom ? pendingCustom.st[i] : 72}"></label>`).join('')}
    <div class="row"><button onclick="saveCustom()">확정</button><button onclick="showFactions(pendingScenario)">취소</button></div>`);
}
function saveCustom() {
  const name = $('cu_n').value.trim(), st = ST.map((s, i) => clamp(+$('cu_' + i).value | 0, 1, 95));
  if (!name || !/^[가-힣A-Za-z0-9]+$/.test(name)) return alertLine('이름은 한글·영문·숫자로 입력하세요.');
  const sum = st.reduce((a, b) => a + b, 0);
  if (sum > CUSTOM_POINTS) return alertLine(`합계가 ${sum}입니다. ${CUSTOM_POINTS} 이하로 줄이세요.`);
  pendingCustom = { name, st };
  showFactions(pendingScenario);
}

// ===================== 화면: 추가 명령 =====================
const fOpts = list => list.map(f => `<option value="${f.id}">${f.name} (우호 ${getRel(G.player, f.id)})</option>`).join('');

function schemeForm(id) {
  const o = G.officers[id];
  const ts = G.cities.filter(c => c.owner && isHostile(G.player, c) && dist(o.city, c.id) <= 2);
  if (!ts.length) return done(fail('2칸 안에 대상 도시가 없습니다.'));
  openModal(`<h2>계략 — ${o.name}</h2>
    <label>종류 <select id="sc_k" onchange="schemeRefresh(${id})">${Object.entries(SCHEME).map(([k, s]) => `<option value="${k}">${s.n} (금 ${s.cost})</option>`).join('')}</select></label>
    <label>도시 <select id="sc_c" onchange="schemeRefresh(${id})">${ts.map(c => `<option value="${c.id}">${c.name} (${fname(c.owner)})</option>`).join('')}</select></label>
    <label id="sc_ow">무장 <select id="sc_o" onchange="schemeRefresh(${id})"></select></label>
    <p class="dim" id="sc_d"></p><div class="flash" id="sc_a"></div>
    <div class="row"><button onclick="schemeGo(${id})">실행</button><button onclick="closeModal()">취소</button></div>`);
  schemeRefresh(id, true);
}
function schemeRefresh(id, first) {
  const o = G.officers[id], k = $('sc_k').value, c = G.cities[+$('sc_c').value], s = SCHEME[k];
  $('sc_ow').style.display = s.off ? '' : 'none';
  if (s.off && (first || document.activeElement !== $('sc_o'))) {
    $('sc_o').innerHTML = cityOfficers(c.id).filter(x => k !== 'lure' || !x.ruler).map(x => `<option value="${x.id}">${x.name}</option>`).join('');
  }
  const t = s.off ? G.officers[+$('sc_o').value] : null;
  $('sc_d').textContent = s.d;
  $('sc_a').textContent = s.off && !t ? '대상 무장이 없습니다.' : advise(G.player, schemeChance(o, k, c, t));
}
function schemeGo(id) {
  const k = $('sc_k').value, s = SCHEME[k];
  done(actScheme(G.officers[id], k, G.cities[+$('sc_c').value], s.off ? G.officers[+$('sc_o').value] : null));
}

function diploForm(id) {
  const fs = FACTIONS.filter(f => f.id !== G.player && alive(f.id));
  if (!fs.length) return done(fail('상대할 세력이 없습니다.'));
  openModal(`<h2>외교 — 사자 ${G.officers[id].name}</h2>
    <label>상대 <select id="dp_f">${fOpts(fs)}</select></label>
    <div class="cmds">
      <button onclick="diplo(${id},'gift')">예물<small>금 500</small></button><button onclick="diplo(${id},'ally')">동맹<small>금 500</small></button>
      <button onclick="diplo(${id},'truce')">정전<small>금 200</small></button><button onclick="diplo(${id},'sur')">항복 권고<small>금 300</small></button>
      <button onclick="diplo(${id},'marry')">혼인<small>금 1,000</small></button><button onclick="diplo(${id},'break')">협정 파기<small>무료</small></button></div>
    <div class="row"><button onclick="closeModal()">취소</button></div>`);
}
function diplo(id, k) {
  const o = G.officers[id], t = $('dp_f').value;
  done(k === 'gift' ? actGift(o, t) : k === 'ally' ? actAlliance(o, t) : k === 'truce' ? actTruce(o, t) : k === 'sur' ? actSurrender(o, t) : k === 'marry' ? actMarriage(o, t) : actBreak(G.player, t));
  if (G.over) showOver();
}

function tradeForm(id) {
  const c = G.cities[G.officers[id].city];
  openModal(`<h2>상인 — 시세 금 1 = 군량 ${foodRate().toFixed(1)}</h2>
    <p class="dim">금 ${num(c.gold)} · 군량 ${num(c.food)} · 군마 ${num(c.horse)} · 강노 ${num(c.bow)}<br>군마는 기병, 강노는 궁병 편성에 쓰입니다. 금 1당 2개를 삽니다.</p>
    <label>거래 <select id="tr_k"><option value="food">군량 사기 (금 입력)</option><option value="sell">군량 팔기 (군량 입력)</option><option value="horse">군마 사기 (금 입력)</option><option value="bow">강노 사기 (금 입력)</option></select></label>
    <label>수량 <input id="tr_n" type="number" min="1" step="100" value="500"></label>
    <div class="row"><button onclick="done(actTrade(G.officers[${id}], $('tr_k').value, +$('tr_n').value))">거래</button><button onclick="closeModal()">취소</button></div>`);
}

const EXTRA_CMD = {
  scheme: (c, offs) => pickOfficer('계략', offs, '지략이 높을수록 성공하기 쉽습니다.', o => schemeForm(o.id)),
  diplo: (c, offs) => pickOfficer('외교', offs, '지략과 인덕이 높은 사자가 유리합니다.', o => diploForm(o.id)),
  trade: (c, offs) => pickOfficer('상인', offs, '거래를 맡을 무장을 고르세요.', o => tradeForm(o.id)),
};
const FREE_CMD = {
  reward(c) {
    const l = cityOfficers(c.id).filter(o => !o.ruler);
    if (!l.length) { flash = '포상할 무장이 없습니다.'; return render(); }
    pickOfficer('포상 — 금 200', l, '충성이 낮은 무장은 떠나거나 적에게 넘어갑니다. ' + l.map(o => `${o.name} ${o.loyal}`).join(' · '), o => done(actReward(c, o)));
  },
  appoint(c) {
    const l = cityOfficers(c.id), a = getAdvisor(G.player), g = getGov(c);
    if (!l.length) { flash = '임명할 무장이 없습니다.'; return render(); }
    openModal(`<h2>임명</h2><p class="dim">현재 군사: ${a ? a.name : '없음'} · ${c.name} 태수: ${g ? g.name : '없음'}<br>군사는 계략의 성패를 조언하고, 태수는 매달 도시를 조금씩 발전시킵니다.</p>
      <label>무장 <select id="ap_o">${l.map(o => `<option value="${o.id}">${o.name} (지략 ${o.st[2]} · 내정 ${o.st[3]})</option>`).join('')}</select></label>
      <div class="row"><button onclick="G.advisor[G.player]=+$('ap_o').value;done(ok(G.officers[+$('ap_o').value].name+'을(를) 군사로 임명했습니다.'))">군사로</button>
      <button onclick="G.cities[sel].gov=+$('ap_o').value;done(ok(G.officers[+$('ap_o').value].name+'을(를) 태수로 임명했습니다.'))">태수로</button><button onclick="closeModal()">취소</button></div>`);
  },
  tax(c) {
    openModal(`<h2>${c.name} 세율</h2><p class="dim">세율이 높으면 수입이 늘지만 민심이 매달 떨어집니다.</p>
      <div class="cmds">${TAX.map((t, i) => `<button onclick="G.cities[sel].tax=${i};done(ok('${c.name}의 세율을 ${t.n}(으)로 정했습니다.'))">${t.n}<small>수입 ×${t.gold} · 민심 ${t.loyal >= 0 ? '+' : ''}${t.loyal}</small></button>`).join('')}</div>
      <div class="row"><button onclick="closeModal()">취소</button></div>`);
  },
  deleg(c) { c.deleg = !c.deleg; flash = `${c.name}: ${c.deleg ? '태수에게 내정을 맡깁니다. (출진은 하지 않습니다)' : '위임을 해제했습니다.'}`; render(); },
};
function showInfo() {
  const rows = FACTIONS.filter(f => alive(f.id)).sort((a, b) => power(b.id) - power(a.id)).map(f => `<tr><td style="color:${f.color}">${f.name}</td><td>${f.ruler}</td><td>${factionCities(f.id).length}</td><td>${num(factionCities(f.id).reduce((s, c) => s + c.troops, 0))}</td><td>${G.officers.filter(o => o.faction === f.id && !o.dead).length}</td><td>${f.id === G.player ? '—' : getRel(G.player, f.id)}${isAllied(G.player, f.id) ? ' 협정' : ''}</td></tr>`).join('');
  const mine = G.officers.filter(o => o.faction === G.player && !o.dead).sort((a, b) => b.st[0] - a.st[0]);
  openModal(`<h2>천하 정세</h2><table class="offs"><tr><th>세력</th><th>군주</th><th>도시</th><th>병력</th><th>무장</th><th>우호</th></tr>${rows}</table>
    <h3 style="margin-top:14px">아군 무장 ${mine.length}명</h3><table class="offs pick"><tr><th>무장</th>${ST.map(s => `<th>${s}</th>`).join('')}<th>충성</th><th>위치</th></tr>
    ${mine.map(o => `<tr onclick="selectCity(${o.city});closeModal()"><td>${o.name}</td>${o.st.map(v => `<td>${v}</td>`).join('')}<td>${o.loyal}</td><td>${G.cities[o.city].name}</td></tr>`).join('')}</table>
    <button class="wide" onclick="closeModal()">닫기</button>`);
}
function showOfficer(id) {
  const o = G.officers[id], see = o.faction === G.player;
  openModal(`<div class="row" style="align-items:center;margin:0 0 10px">${portrait(o, 96)}<div><h2 style="margin:0">${o.name}</h2><div class="dim">${o.faction ? F[o.faction].name : '재야'}${o.ruler ? ' · 군주' : ''}${getAdvisor(o.faction) === o ? ' · 군사' : ''}</div>${see && !o.ruler ? `<div>충성 ${o.loyal}</div>` : ''}</div></div>
    <table class="stats">${ST.map((s, i) => `<tr><td>${s}</td><td><span class="bar"><i style="width:${o.st[i]}%"></i></span> ${o.st[i]}</td></tr>`).join('')}</table>${officerExtra(o)}
    <button class="wide" onclick="closeModal()">닫기</button>`);
}
function uiCaptive(o, f) {
  return new Promise(resolve => {
    window._cap = v => { closeModal(); resolve(v); };
    openModal(`<div class="row" style="align-items:center;margin:0 0 10px">${portrait(o, 72)}<div><h2 style="margin:0">포로 ${o.name}</h2><div class="dim">통${o.st[0]} 무${o.st[1]} 지${o.st[2]} 내${o.st[3]} 덕${o.st[4]}</div></div></div>
      <div class="row"><button onclick="_cap('recruit')">등용</button><button onclick="_cap('free')">석방</button><button class="atk" onclick="_cap('kill')">처형</button></div>`);
  });
}

</script>
<script>
'use strict';
/* nation3 — 역사 이벤트, 보물, 황제·관직, 수전, 무장별 병력, 혈연, 혼인 */

const offNamed = n => G.officers.find(o => o.name === n);
const activeOff = n => { const o = offNamed(n); return o && !o.dead && !o.debut ? o : null; };
const isRulerNamed = n => { const o = activeOff(n); return !!(o && o.ruler && o.faction); };
const cityNamed = n => G.cities[CNAME.indexOf(n)];
const sameSide = (...l) => { const a = l.map(activeOff); return a.every(o => o && o.faction && o.faction === a[0].faction); };

// ===================== 혈연·의형제 =====================
const KIN = [['유비', '관우', '장비'], ['조조', '하후돈', '하후연', '조인', '조홍'], ['손견', '손책', '손권'], ['원소', '원술'], ['마등', '마초', '마대'], ['유언', '유장'], ['장각', '장보', '장량'], ['동탁', '이유']];
function isKin(a, b) {
  if (a === b) return false;
  return KIN.some(g => g.includes(a) && g.includes(b)) || G.bonds.some(([x, y]) => (x === a && y === b) || (x === b && y === a));
}
function rulerOf(f) { return G.officers.find(o => o.ruler && o.faction === f && !o.dead) || null; }
function kinAdj(o, f) {
  const mine = rulerOf(f), old = o.faction && o.faction !== f ? rulerOf(o.faction) : null;
  return (mine && isKin(o.name, mine.name) ? 0.3 : 0) - (old && isKin(o.name, old.name) ? 0.35 : 0);
}
function actBond(c, o) {
  const r = rulerOf(G.player);
  if (!r || r.city !== c.id) return fail('군주가 이 도시에 있어야 합니다.');
  if (o.ruler) return fail('군주 자신과는 결의할 수 없습니다.');
  if (isKin(o.name, r.name)) return fail('이미 형제나 다름없는 사이입니다.');
  if (o.loyal < 90) return fail(`충성이 90 이상이어야 합니다. (현재 ${o.loyal})`);
  if (G.bonds.filter(b => b.includes(r.name)).length >= 2) return fail('의형제는 두 명까지 맺을 수 있습니다.');
  if (c.gold < 500) return fail('금이 부족합니다. (500 필요)');
  c.gold -= 500; G.bonds.push([r.name, o.name]); o.loyal = 100;
  return ok(`${r.name}과(와) ${o.name}이(가) 의형제를 맺었습니다!`);
}

// ===================== 보물 =====================
// 이름, 능력치 번호, 상승치, 전장 이동 보너스, 주인 후보, 숨겨진 도시
const ITEMS = [
  ['적토마', 1, 3, 2, ['동탁', '여포', '관우'], '장안'], ['적로', 0, 2, 1, ['유비'], '양양'], ['절영', 0, 2, 1, ['조조'], '허창'],
  ['청룡언월도', 1, 5, 0, ['관우'], '하비'], ['장팔사모', 1, 5, 0, ['장비'], '하비'], ['방천화극', 1, 5, 0, ['여포'], '복양'], ['쌍고검', 1, 3, 0, ['유비'], '평원'],
  ['의천검', 0, 4, 0, ['조조'], '진류'], ['청강검', 1, 4, 0, [], '허창'], ['고정도', 1, 4, 0, ['손견', '손책', '손권'], '건업'],
  ['손자병법', 2, 5, 0, [], '오'], ['오자병법', 0, 5, 0, [], '업'], ['맹덕신서', 2, 4, 0, ['조조'], '진류'], ['태평요술서', 2, 6, 0, ['장각'], '업'],
  ['춘추좌씨전', 2, 3, 0, ['관우'], '낙양'], ['논어', 3, 4, 0, [], '북해'], ['사민월령', 3, 5, 0, [], '성도'], ['옥새', 4, 8, 0, [], '낙양'],
];
function giveItem(it, o) {
  if (it.hold !== null) { const p = G.officers[it.hold]; if (!p.dead) p.st[it.s] -= it.b; }
  it.hold = o.id; it.city = null; o.st[it.s] += it.b;
}
const itemsOf = o => G.items.filter(i => i.hold === o.id);
const itemMove = o => itemsOf(o).reduce((n, i) => n + i.mv, 0);
function searchItem(o, c) {
  const l = G.items.filter(i => i.hold === null && i.city === c.id);
  if (!l.length || Math.random() > (o.st[2] + o.st[3]) / 320) return null;
  const it = l[ri(0, l.length - 1)];
  giveItem(it, o);
  return it;
}
function sweepItems() {
  G.items.forEach(it => {
    if (it.hold !== null && G.officers[it.hold].dead) { it.hold = null; it.city = ri(0, G.cities.length - 1); }
  });
}

// ===================== 황제·작위·관직 =====================
const TITLES = [['태수', 0], ['자사', 3], ['주목', 5], ['장군', 7], ['대장군', 10], ['공', 14], ['왕', 18], ['황제', 22]];
const RANKS = [null, { n: '편장군', cmd: 1, need: 2, max: 99 }, { n: '중랑장', cmd: 2, need: 3, max: 6 }, { n: '장군', cmd: 3, need: 4, max: 3 }, { n: '대장군', cmd: 5, need: 5, max: 1 }];
const titleLv = f => G.title[f] || 0;
const titleName = f => TITLES[titleLv(f)][0];
const empCity = () => G.cities[G.emp];
const holdsEmperor = f => empCity().owner === f && titleLv(f) < 7;
function titleNeed(f) {
  const next = TITLES[titleLv(f) + 1];
  return next ? { name: next[0], cities: Math.max(1, next[1] - (holdsEmperor(f) ? 3 : 0)), gold: (titleLv(f) + 1) * 400 } : null;
}
function actTitle(f, c) {
  const n = titleNeed(f);
  if (!n) return fail('더 오를 자리가 없습니다.');
  if (factionCities(f).length < n.cities) return fail(`도시 ${n.cities}개가 필요합니다.`);
  if (c.gold < n.gold) return fail(`금이 부족합니다. (${n.gold} 필요)`);
  c.gold -= n.gold; G.title[f] = titleLv(f) + 1;
  G.officers.forEach(o => { if (o.faction === f && !o.ruler) o.loyal = clamp(o.loyal + 5, 0, 100); });
  if (n.name === '황제') FACTIONS.forEach(x => { if (x.id !== f && alive(x.id)) addRel(f, x.id, -15); });
  log(`${F[f].ruler}이(가) ${n.name}의 자리에 올랐습니다!`, 'big');
  return ok(`${F[f].ruler}: ${n.name}에 올랐습니다.`);
}
function setRank(o, r) {
  const old = RANKS[o.rank || 0], nw = RANKS[r];
  o.st[0] += (nw ? nw.cmd : 0) - (old ? old.cmd : 0); o.rank = r;
}
function actRank(o, r) {
  const k = RANKS[r], f = o.faction;
  if (titleLv(f) < k.need) return fail(`군주가 ${TITLES[k.need][0]} 이상이어야 합니다.`);
  if (o.ruler) return fail('군주에게는 줄 수 없습니다.');
  if ((o.rank || 0) === r) return fail('이미 그 관직에 있습니다.');
  if (G.officers.filter(x => x.faction === f && !x.dead && x.rank === r).length >= k.max) return fail(`${k.n} 자리가 찼습니다.`);
  setRank(o, r); o.loyal = clamp(o.loyal + 10, 0, 100);
  return ok(`${o.name}을(를) ${k.n}에 임명했습니다. (통솔 +${k.cmd})`);
}
function actEdict(o, kind, t) {
  const c = G.cities[o.city], f = o.faction;
  if (empCity().owner !== f) return fail('황제를 모시고 있어야 합니다.');
  if (c.gold < 500) return fail('금이 부족합니다. (500 필요)');
  if (!alive(t) || t === f) return fail('대상이 없습니다.');
  c.gold -= 500; o.acted = true;
  if (kind === 'peace') {
    if (isAllied(f, t)) return ok(`${F[t].name}과(와)는 이미 협정 중입니다.`);
    G.allies.push({ a: f, b: t, until: now() + 12, kind: 'truce' });
    return ok(`칙명으로 ${F[t].name}과(와) 12개월간 정전했습니다.`);
  }
  FACTIONS.forEach(x => { if (x.id !== t && alive(x.id)) addRel(x.id, t, -12); });
  factionCities(t).forEach(x => { x.loyal = Math.max(0, x.loyal - 5); });
  return ok(`칙명으로 ${F[t].name}을(를) 역적으로 선포했습니다!`);
}

// ===================== 혼인 =====================
function actMarriage(o, t) {
  const c = G.cities[o.city], f = o.faction, key = relKey(f, t);
  if (G.marry.includes(key)) return fail('이미 혼인 관계입니다.');

const capOf = o => o.st[0] * 120;
const commandCap = offs => offs.reduce((n, o) => n + capOf(o), 0);
function syncMen(c) {
  const l = cityOfficers(c.id);
  if (!l.length) return;
  if (!c.manual) {
    const sum = commandCap(l) || 1;
    l.forEach(o => { o.men = Math.min(capOf(o), Math.floor(c.troops * capOf(o) / sum / 100) * 100); });
    return;
  }
  l.forEach(o => { o.men = Math.min(o.men || 0, capOf(o)); });
  const total = l.reduce((n, o) => n + o.men, 0);
  if (total > c.troops) l.forEach(o => { o.men = Math.floor(o.men * c.troops / total / 100) * 100; });
}
